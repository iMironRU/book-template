# Журнал изменений файлов шаблона между версиями.
# Используется командой ./book.sh sync для предложения конкретных файлов к обновлению.
#
# Формат:
#   vX.Y.Z:
#     added:    [ список новых файлов ]
#     changed:  [ список изменённых файлов ]
#     removed:  [ список удалённых файлов ]

v0.1.0:
